name: Free 20-Runner Episode Render

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Episode slug under public/episodes/
        required: true
        default: crush-island-10min
      workers:
        description: Number of parallel Linux runners (max 20 concurrent free)
        required: true
        default: '20'
      concurrency:
        description: Chromium tabs per runner
        required: true
        default: '4'
      max_frames:
        description: Maximum frames to render (2700 = 90s Director Cut)
        required: false
        default: '2700'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.calc.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack engine source if packaged
        run: |
          if [ -f engine_src.tar.gz ]; then tar -xzf engine_src.tar.gz; fi
      - name: Partition frames across parallel runners
        id: calc
        run: |
          python3 - <<'PY'
          import json, math, os
          slug = "${{ inputs.slug }}"
          n = int("${{ inputs.workers }}")
          max_f = int("${{ inputs.max_frames }}" or "2700")
          ep = json.load(open(f"public/episodes/{slug}/episode.json"))
          tm = json.load(open(f"public/episodes/{slug}/timing.json"))
          total = min(max_f, max(1, math.ceil(tm["total"] * (ep.get("fps") or 30))))
          step = math.ceil(total / n)
          chunks = []
          for idx in range(n):
              a = idx * step
              b = min(total - 1, (idx + 1) * step - 1)
              if a <= b:
                  chunks.append({"idx": f"{idx:02d}", "start": a, "end": b})
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps(chunks) + "\n")
          print(f"Planned {total} frames across {len(chunks)} runners")
          PY

  render_chunk:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      REMOTION_GL: swangle
    steps:
      - uses: actions/checkout@v4
      - name: Unpack engine source
        run: |
          if [ -f engine_src.tar.gz ]; then tar -xzf engine_src.tar.gz; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Ensure ffmpeg + browser dependencies
        run: |
          CHROME_BIN=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME_BIN" ]; then
            echo "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true" >> "$GITHUB_ENV"
            echo "REMOTION_CHROME_EXECUTABLE=$CHROME_BIN" >> "$GITHUB_ENV"
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg libgbm1 libnss3
          fi
      - name: Install Node dependencies & patch Remotion WebGL2 capture
        run: |
          npm ci --force --no-audit --no-fund
          node tools/patch-remotion.cjs
          if [ -z "${REMOTION_CHROME_EXECUTABLE:-}" ]; then
            npx remotion browser ensure --chrome-mode=chrome-for-testing
          fi
      - name: Render frame slice ${{ matrix.chunk.start }}-${{ matrix.chunk.end }}
        run: |
          node tools/build-episode.mjs "${{ inputs.slug }}" \
            --frames=${{ matrix.chunk.start }}-${{ matrix.chunk.end }} \
            --concurrency=${{ inputs.concurrency }} \
            --no-audio --force
          mv "out/${{ inputs.slug }}/video.mp4" "chunk-${{ matrix.chunk.idx }}.mp4"
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames,width,height -of default=nw=1 "chunk-${{ matrix.chunk.idx }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk90-${{ matrix.chunk.idx }}
          path: chunk-${{ matrix.chunk.idx }}.mp4
          retention-days: 2

  stitch:
    needs: render_chunk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: chunk90-*
          merge-multiple: true
      - name: Stitch 20 silent 1080p MP4 chunks & publish 90s release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          for f in $(ls chunks/chunk-*.mp4 | sort); do
            echo "file '$PWD/$f'" >> list.txt
          done
          ffmpeg -y -v error -f concat -safe 0 -i list.txt \
            -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p -movflags +faststart \
            "Crush_Island_Director_Cut_90s_silent.mp4"
          ls -lh "Crush_Island_Director_Cut_90s_silent.mp4"
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,r_frame_rate -of default=nw=1 "Crush_Island_Director_Cut_90s_silent.mp4"
          TAG="v3.0-${{ inputs.slug }}-90s"
          gh release create "$TAG" "Crush_Island_Director_Cut_90s_silent.mp4" \
            --title "90s Director Cut: ${{ inputs.slug }}" \
            --notes "20-runner 1080p 30fps 90s Director Cut" || \
          gh release upload "$TAG" "Crush_Island_Director_Cut_90s_silent.mp4" --clobber
