name: Publish Release Asset

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID with artifact'
        required: true
        default: '43555244712'
      artifact_name:
        description: 'Artifact name to publish'
        required: true
        default: 'crush-island-10min-silent-video'
      tag:
        description: 'Release tag'
        required: true
        default: 'v1.0-crush-island-10min'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from completed run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p art out
          gh run download "${{ github.event.inputs.run_id }}" \
            -n "${{ github.event.inputs.artifact_name }}" \
            -R "${{ github.repository }}" \
            -D ./art
          ls -lh ./art
          MP4_PATH=$(find ./art -type f -name '*.mp4' | head -n 1)
          test -n "$MP4_PATH"
          cp "$MP4_PATH" ./out/crush-island-10min-silent.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 ./out/crush-island-10min-silent.mp4
          SIZE_BYTES=$(stat -c%s ./out/crush-island-10min-silent.mp4)
          echo "Original size: $SIZE_BYTES bytes"
          if [ "$SIZE_BYTES" -gt 800000000 ]; then
            ffmpeg -y -i ./out/crush-island-10min-silent.mp4 \
              -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -movflags +faststart \
              ./out/crush-island-10min-silent-crf17.mp4
            ls -lh ./out/
          fi

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          gh release delete "$TAG" -R "${{ github.repository }}" --yes --cleanup-tag >/dev/null 2>&1 || true
          ASSETS=()
          for f in ./out/*.mp4; do
            SZ=$(stat -c%s "$f")
            echo "Candidate $f ($SZ bytes)"
            if [ "$SZ" -le 2050000000 ]; then
              ASSETS+=("$f")
            fi
          done
          test "${#ASSETS[@]}" -gt 0
          gh release create "$TAG" "${ASSETS[@]}" \
            -R "${{ github.repository }}" \
            --target "${{ github.ref_name }}" \
            --title "crush-island-10min rendered assets" \
            --notes "Silent 1080p@30fps render output from run ${{ github.event.inputs.run_id }}"
